<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#060914"><link rel="manifest" href="/manifest.webmanifest"><title>L.E.O. Mobile</title>
<style>
:root{--bg:#050711;--p:#0c1221;--line:#26304a;--txt:#eef5ff;--muted:#94a0b8;--cyan:#27d9ff;--green:#48e6a1;--amber:#ffc857}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#1c1238,#070a14 48%,#050711);color:var(--txt);font:15px Segoe UI,Arial,sans-serif;min-height:100vh}.app{max-width:720px;margin:auto;padding:14px}.top{display:flex;align-items:center;gap:12px;padding:8px 0 14px;border-bottom:1px solid var(--line)}.logo{width:46px;height:46px;filter:drop-shadow(0 0 12px #27d9ff66)}h1{font-size:19px;margin:0}.muted{color:var(--muted);font-size:12px}.status{margin-left:auto;border:1px solid var(--line);padding:7px 10px;border-radius:20px;font-size:11px}.online{color:var(--green)}.hero{margin-top:14px;padding:18px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#0d1425,#080d19);box-shadow:0 14px 35px #0006}.hero h2{font-size:17px;margin:0 0 6px}.chat{min-height:45vh;max-height:58vh;overflow:auto;padding:4px}.m{padding:11px 13px;border-radius:12px;margin:9px 0;white-space:pre-wrap;line-height:1.45}.u{background:#17294d;margin-left:10%}.l{background:#111a2b;margin-right:10%}.approval{border:1px solid #735f25;background:#2a2415;padding:13px;border-radius:12px;margin:10px 0}.approval button{margin-top:10px;border:0;border-radius:9px;padding:9px 12px;font-weight:700}.row{display:flex;gap:8px;margin-top:10px}.input{flex:1;min-width:0;background:#080e1a;color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit}.send,.voice{border:1px solid #31506e;background:#10213a;color:#a8edff;border-radius:12px;padding:0 14px;font-weight:700}.voice.rec{background:#3a1721;color:#ffabb7}.settings{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.settings input,.settings select{width:100%;background:#080e1a;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:9px}.small{font-size:11px;color:var(--muted);margin-top:8px}.install{display:none;margin-top:10px;border:1px solid #31506e;background:#101d31;color:#b8edff;padding:10px;border-radius:10px;width:100%}
</style>
</head>
<body><main class="app">
<header class="top"><img class="logo" src="/assets/leo-wolf.svg" alt="L.E.O."><div><h1>L.E.O. Mobile</h1><div class="muted">Remote owner console</div></div><div id="status" class="status">Cloud offline</div></header>
<section class="hero"><h2>Command your L.E.O. PC</h2><div class="muted">Cloud relays only. Execution remains on your Windows PC.</div>
<div class="settings"><input id="ws" placeholder="Cloud WebSocket URL"><input id="device" placeholder="Device ID"></div>
<div class="settings"><input id="token" type="password" placeholder="Remote token"><select id="lang"><option value="bn-BD">Bangla</option><option value="en-US">English / Banglish</option></select></div>
<button id="install" class="install">Install L.E.O. Mobile</button>
<div id="chat" class="chat"></div>
<div class="row"><button id="voice" class="voice">🎙</button><input id="cmd" class="input" placeholder="Write your command…"><button id="send" class="send">Send</button></div>
<div id="voiceStatus" class="small">Voice uses browser speech recognition when supported.</div></section>
</main>
<script>
const $=id=>document.getElementById(id),chat=$("chat"),status=$("status"),cmd=$("cmd"),token=$("token"),wsInput=$("ws"),device=$("device");let sock;let pending=new Map();let recognition;const cfg=JSON.parse(localStorage.getItem("leoMobileConfig")||"{}");wsInput.value=cfg.ws||"";device.value=cfg.device||"leo-owner-pc";token.value=cfg.token||"";
function save(){localStorage.setItem("leoMobileConfig",JSON.stringify({ws:wsInput.value,device:device.value,token:token.value}))}
function msg(t,c){const d=document.createElement("div");d.className="m "+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function connect(){save();if(!wsInput.value||!device.value||!token.value){status.textContent="Configure connection";return}try{const u=new URL(wsInput.value);u.searchParams.set("device",device.value);sock=new WebSocket(u);sock.onopen=()=>{sock.send(JSON.stringify({type:"auth",role:"mobile",token:token.value}));status.textContent="Connecting…"};sock.onclose=()=>{status.textContent="Disconnected";setTimeout(connect,5000)};sock.onerror=()=>status.textContent="Connection error";sock.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==="authenticated"){status.innerHTML='<span class="online">● Connected</span>';return}if(m.type==="status"){status.innerHTML=m.pcOnline?'<span class="online">● PC ONLINE</span>':'● PC OFFLINE';return}if(m.type==="result"){const p=pending.get(m.requestId);if(p){pending.delete(m.requestId);renderResult(m.payload)}}};}catch{status.textContent="Invalid cloud URL"}}
function renderResult(r){if(r.type==="approval_required"){const d=document.createElement("div");d.className="approval";d.innerHTML="<b>Owner approval required</b><div class='small'>"+esc(r.response)+"<br>Tool: "+esc(r.toolName)+"</div><button>Approve & Execute</button>";d.querySelector("button").onclick=()=>{d.querySelector("button").disabled=true;const id=crypto.randomUUID();pending.set(id,true);sock.send(JSON.stringify({type:"approve",requestId:id,payload:{userMessage:"approved action",source:"text",approvalId:r.approvalId,traceId:r.traceId}}));d.querySelector("button").textContent="Executing…"};chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return}msg(r.response||JSON.stringify(r,null,2),"l")}
function esc(v){return String(v).replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;","'":"&#039;"}[x]))}
function send(){const text=cmd.value.trim();if(!text)return;if(!sock||sock.readyState!==1){msg("L.E.O. PC is not connected.","l");return}cmd.value="";msg(text,"u");const id=crypto.randomUUID();pending.set(id,true);sock.send(JSON.stringify({type:"execute",requestId:id,payload:{userMessage:text,source:"text",conversation:[]}}))}
$("send").onclick=send;cmd.addEventListener("keydown",e=>{if(e.key==="Enter")send()});["ws","device","token"].forEach(id=>$(id).addEventListener("change",save));
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){recognition=new SR();recognition.continuous=false;recognition.interimResults=false;recognition.onstart=()=>{$("voice").classList.add("rec");$("voiceStatus").textContent="Listening…"};recognition.onend=()=>{$("voice").classList.remove("rec")};recognition.onerror=e=>$("voiceStatus").textContent="Voice error: "+e.error;recognition.onresult=e=>{cmd.value=e.results[0][0].transcript;send()};$("voice").onclick=()=>{recognition.lang=$("lang").value;recognition.start()}}else $("voice").disabled=true;
let deferred;$("install").onclick=()=>deferred?.prompt();window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;$("install").style.display="block"});if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js");connect();
</script>
</body></html>
