<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#060914"><link rel="manifest" href="/manifest.webmanifest"><title>L.E.O. Mobile</title>
<style>
:root{--bg:#050711;--panel:#0b1020;--line:#26304a;--txt:#eef5ff;--muted:#94a0b8;--cyan:#27d9ff;--green:#48e6a1;--amber:#ffc857}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--txt);font:15px Inter,Segoe UI,Arial,sans-serif}
body{overflow:hidden}.app{height:100dvh;display:flex;flex-direction:column;max-width:720px;margin:auto;background:radial-gradient(circle at 50% -15%,#21143e 0,#080b16 42%,var(--bg) 78%)}
.top{height:64px;flex:0 0 64px;display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:#070b15e8;backdrop-filter:blur(12px)}
.logo{width:40px;height:40px;flex:0 0 40px;filter:drop-shadow(0 0 11px #27d9ff66)}.brand{min-width:0}.brand h1{font-size:17px;margin:0}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.status{margin-left:auto;border:1px solid var(--line);border-radius:18px;padding:6px 9px;font-size:10px;white-space:nowrap}.online{color:var(--green)}
.main{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px 10px 0;overflow:hidden}.connection{border:1px solid var(--line);background:#0b1120cc;border-radius:13px;padding:9px;margin-bottom:9px}.connection summary{cursor:pointer;color:#b9c7df;font-size:11px}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.settings input,.settings select{width:100%;min-width:0;background:#080e1a;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:9px;font:12px inherit}
.chat{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 2px 8px}.m{padding:11px 12px;border-radius:13px;margin:8px 0;white-space:pre-wrap;line-height:1.45;max-width:88%;word-break:break-word}.u{background:#17294d;margin-left:auto}.l{background:#111a2b;margin-right:auto}
.approval{border:1px solid #735f25;background:#2a2415;padding:12px;border-radius:12px;margin:8px 0;font-size:13px}.approval button{margin-top:9px;border:0;border-radius:9px;padding:9px 12px;font-weight:700}
.composer{flex:0 0 auto;padding:8px 0 calc(8px + env(safe-area-inset-bottom));background:linear-gradient(#05071100,#050711 20%);display:flex;gap:7px;align-items:flex-end}
.input{flex:1;min-width:0;max-height:110px;resize:none;background:#080e1a;color:var(--txt);border:1px solid var(--line);border-radius:13px;padding:11px;font:14px inherit;outline:none}
.send,.voice{height:44px;min-width:44px;border:1px solid #31506e;background:#10213a;color:#a8edff;border-radius:12px;font-weight:800}.voice.rec{background:#3a1721;color:#ffabb7}.send{padding:0 13px;background:var(--cyan);color:#031017;border-color:var(--cyan)}
.voiceStatus{font-size:10px;color:var(--muted);padding:0 3px 5px;min-height:14px}.install{display:none;width:100%;margin-top:8px;border:1px solid #31506e;background:#101d31;color:#b8edff;padding:9px;border-radius:10px}
@media(min-width:721px){body{overflow:auto}.app{min-height:100vh;border-left:1px solid var(--line);border-right:1px solid var(--line)}}
@media(max-width:380px){.top{padding-left:9px;padding-right:9px}.logo{width:36px;height:36px;flex-basis:36px}.brand h1{font-size:15px}.status{font-size:9px;padding:5px 7px}.settings{grid-template-columns:1fr}.send{padding:0 10px}.m{max-width:94%}}
</style>
</head>
<body><main class="app"><header class="top"><img class="logo" src="/assets/leo-wolf.svg" alt="L.E.O."><div class="brand"><h1>L.E.O. Mobile</h1><small>Owner remote console · PC execution stays governed</small></div><div id="status" class="status">Offline</div></header><section class="main"><details class="connection"><summary>Connection & device settings</summary><div class="settings"><input id="ws" placeholder="Cloud WebSocket URL" autocomplete="off"><input id="device" placeholder="Device ID" autocomplete="off"><input id="token" type="password" placeholder="Remote token" autocomplete="off"><select id="lang"><option value="bn-BD">বাংলা</option><option value="en-US">English / Banglish</option></select></div><button id="install" class="install">Install L.E.O. Mobile</button></details><div id="chat" class="chat" aria-live="polite"></div><div class="voiceStatus" id="voiceStatus">Voice command available when supported by the browser.</div><div class="composer"><button id="voice" class="voice" aria-label="Voice command">🎙</button><textarea id="cmd" class="input" rows="1" placeholder="L.E.O.-কে command দিন…"></textarea><button id="send" class="send">Send</button></div></section></main>
<script>
const $=id=>document.getElementById(id),chat=$("chat"),status=$("status"),cmd=$("cmd"),token=$("token"),wsInput=$("ws"),device=$("device");let sock;let pending=new Map();let recognition;const cfg=JSON.parse(localStorage.getItem("leoMobileConfig")||"{}");wsInput.value=cfg.ws||"";device.value=cfg.device||"leo-owner-pc";token.value=cfg.token||"";
function save(){localStorage.setItem("leoMobileConfig",JSON.stringify({ws:wsInput.value,device:device.value,token:token.value}))}
function msg(t,c){const d=document.createElement("div");d.className="m "+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function connect(){save();if(!wsInput.value||!device.value||!token.value){status.textContent="Configure connection";return}try{const u=new URL(wsInput.value);u.searchParams.set("device",device.value);sock=new WebSocket(u);sock.onopen=()=>{sock.send(JSON.stringify({type:"auth",role:"mobile",token:token.value}));status.textContent="Connecting…"};sock.onclose=()=>{status.textContent="Disconnected";setTimeout(connect,5000)};sock.onerror=()=>status.textContent="Connection error";sock.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==="authenticated"){status.innerHTML='<span class="online">● Connected</span>';return}if(m.type==="status"){status.innerHTML=m.pcOnline?'<span class="online">● PC ONLINE</span>':'● PC OFFLINE';return}if(m.type==="result"){const p=pending.get(m.requestId);if(p){pending.delete(m.requestId);renderResult(m.payload)}}};}catch{status.textContent="Invalid cloud URL"}}
function renderProgress(p){if(!p)return;const pct=p.progress==null?"":" · "+p.progress+"%";msg("LIVE "+(p.status||"running")+pct+"\n"+(p.currentStep||""),"l")}
function renderResult(r){if(r.type==="approval_required"){const d=document.createElement("div");d.className="approval";d.innerHTML="<b>Owner approval required</b><div class='small'>"+esc(r.response)+"<br>Tool: "+esc(r.toolName)+"</div><button>Approve & Execute</button>";d.querySelector("button").onclick=()=>{d.querySelector("button").disabled=true;const id=crypto.randomUUID();pending.set(id,true);sock.send(JSON.stringify({type:"approve",requestId:id,payload:{userMessage:"approved action",source:"text",approvalId:r.approvalId,traceId:r.traceId}}));d.querySelector("button").textContent="Executing…"};chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return}msg(r.response||JSON.stringify(r,null,2),"l")}
function esc(v){return String(v).replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[x]))}
function resize(){cmd.style.height="auto";cmd.style.height=Math.min(cmd.scrollHeight,110)+"px"}\nfunction send(){const text=cmd.value.trim();if(!text)return;if(!sock||sock.readyState!==1){msg("L.E.O. PC is not connected.","l");return}cmd.value="";msg(text,"u");const id=crypto.randomUUID();pending.set(id,true);sock.send(JSON.stringify({type:"execute",requestId:id,payload:{userMessage:text,source:"text",conversation:[]}}))}
$("send").onclick=send;cmd.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});cmd.addEventListener("input",resize);["ws","device","token"].forEach(id=>$(id).addEventListener("change",save));
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){recognition=new SR();recognition.continuous=false;recognition.interimResults=false;recognition.onstart=()=>{$("voice").classList.add("rec");$("voiceStatus").textContent="Listening…"};recognition.onend=()=>{$("voice").classList.remove("rec")};recognition.onerror=e=>$("voiceStatus").textContent="Voice error: "+e.error;recognition.onresult=e=>{cmd.value=e.results[0][0].transcript;send()};$("voice").onclick=()=>{recognition.lang=$("lang").value;recognition.start()}}else $("voice").disabled=true;
let deferred;$("install").onclick=()=>deferred?.prompt();window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;$("install").style.display="block"});if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js");connect();
</script>
</body></html>
