[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leo-1-1-0"
version = "1.1.0"
description = "L.E.O. Living Ecosystem Orchestrator - pure Python migration"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["leo_python/tests"]
addopts = "-q"
