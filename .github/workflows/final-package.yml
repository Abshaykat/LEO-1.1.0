name: L.E.O. Windows Package

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      LEO_COMMAND_WORKING_DIRECTORY: ${{ github.workspace }}
      LEO_BACKUP_KEY: ci-only-test-key-never-used-for-owner-backups
      LEO_BACKUP_ROOT: ${{ github.workspace }}\ci-backups
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Regression
        run: npm test
      - name: Backup Integrity
        run: npm run test:backup
      - name: Web E2E
        run: npm run test:web-e2e
      - name: Package
        shell: pwsh
        run: |
          ./Package-LEO.ps1
          if (!(Test-Path "./LEO-1.1.0-windows.zip")) { throw "Package ZIP was not created." }
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LEO-1.1.0-windows
          path: LEO-1.1.0-windows.zip
          if-no-files-found: error
