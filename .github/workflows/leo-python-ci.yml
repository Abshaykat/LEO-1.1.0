name: LEO Python CI
on:
  push:
    branches: ["rewrite/pure-python-mark-leo"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest pytest-asyncio
      - name: Compile Python
        run: python -m compileall -q leo_python
      - name: Run Python tests
        run: python -m pytest -q leo_python/tests
